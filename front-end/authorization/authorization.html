<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ферум — Авторизация</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Custom Config for Industrial Metallic Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ferum: {
                            dark: '#0f141c',
                            card: '#161d2b',
                            border: '#2a374c',
                            accent: '#f97316', // Industrial orange glow
                            accentHover: '#ea580c',
                            steel: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Industrial Grid Background & Glow Effects */
        body {
            background-color: #0f141c;
            background-image:
                    radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.08) 0%, transparent 40%),
                    linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
        }
        .metallic-border {
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.4);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">

<div id="app-container" class="w-full max-w-md transition-all duration-500">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="bg-ferum-card rounded-2xl metallic-border p-8 relative overflow-hidden backdrop-blur-md">

        <!-- Industrial Corner Accents -->
        <div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-ferum-accent"></div>
        <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-ferum-accent"></div>
        <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-ferum-accent"></div>
        <div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-ferum-accent"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-br from-ferum-dark to-ferum-border border border-ferum-border shadow-inner mb-4 text-ferum-accent text-2xl font-bold">
                <i class="fa-solid fa-cube animate-pulse"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wider">Ф Е Р У М</h1>
            <p class="text-ferum-steel text-sm mt-1">Промышленная экосистема доступа</p>
        </div>

        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">

            <!-- Login Input -->
            <div>
                <label class="block text-xs font-semibold text-ferum-steel uppercase tracking-wider mb-2">Логин или Email</label>
                <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-ferum-steel">
                            <i class="fa-solid fa-user"></i>
                        </span>
                    <input type="text" id="username" required
                           class="w-full pl-10 pr-4 py-3 bg-ferum-dark border border-ferum-border rounded-xl text-white placeholder-ferum-steel/50 focus:outline-none input-glow transition-all text-sm"
                           placeholder="Введите ваш логин">
                </div>
                <p id="username-error" class="text-red-400 text-xs mt-1 hidden">Поле обязательно для заполнения</p>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-xs font-semibold text-ferum-steel uppercase tracking-wider mb-2">Пароль</label>
                <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-ferum-steel">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                    <input type="password" id="password" required
                           class="w-full pl-10 pr-12 py-3 bg-ferum-dark border border-ferum-border rounded-xl text-white placeholder-ferum-steel/50 focus:outline-none input-glow transition-all text-sm"
                           placeholder="••••••••">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-ferum-steel hover:text-white transition-colors">
                        <i id="eye-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <p id="password-error" class="text-red-400 text-xs mt-1 hidden">Введите корректный пароль</p>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center space-x-2 cursor-pointer text-ferum-steel hover:text-white">
                    <input type="checkbox" class="rounded bg-ferum-dark border-ferum-border text-ferum-accent focus:ring-0">
                    <span>Запомнить меня</span>
                </label>
                <a href="#" onclick="showRecoveryModal(event)" class="text-ferum-accent hover:underline font-medium">Восстановить?</a>
            </div>

            <!-- Notification Alert Box (Custom instead of alert()) -->
            <div id="auth-alert" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center">
                Неверный логин или пароль. Попробуйте снова.
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-ferum-accent to-ferum-accentHover text-white font-semibold rounded-xl shadow-lg shadow-orange-900/30 hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                <span id="btn-text">Войти в систему</span>
                <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
            </button>
        </form>

        <div class="mt-6 text-center border-t border-ferum-border/50 pt-5">
            <p class="text-xs text-ferum-steel">
                Впервые на «Ферум»?
                <a href="#" onclick="showRegisterNotice(event)" class="text-ferum-accent font-medium hover:underline ml-1">Создать аккаунт</a>
            </p>
        </div>
    </div>

    <!-- DASHBOARD VIEW (Hidden by default) -->
    <div id="dashboard-view" class="hidden bg-ferum-card rounded-2xl metallic-border p-8 relative overflow-hidden">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-ferum-border">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-ferum-accent/20 border border-ferum-accent/40 flex items-center justify-center text-ferum-accent font-bold">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <h2 id="dash-username" class="text-white font-semibold text-base">Оператор</h2>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            ● Онлайн статус
                        </span>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-ferum-steel hover:text-red-400 p-2 rounded-lg transition-colors" title="Выйти">
                <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </button>
        </div>

        <!-- Dashboard Content Cards -->
        <div class="space-y-4 mb-6">
            <div class="p-4 bg-ferum-dark rounded-xl border border-ferum-border">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-ferum-steel uppercase">Состояние систем</span>
                    <span class="text-emerald-400 text-xs font-semibold">99.8%</span>
                </div>
                <div class="w-full bg-ferum-border h-2 rounded-full overflow-hidden">
                    <div class="bg-ferum-accent h-full rounded-full" style="width: 85%"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="p-4 bg-ferum-dark rounded-xl border border-ferum-border text-center">
                    <i class="fa-solid fa-server text-ferum-accent text-lg mb-2"></i>
                    <p class="text-[11px] text-ferum-steel">Узлы сети</p>
                    <p class="text-white font-bold text-sm">12 Активных</p>
                </div>
                <div class="p-4 bg-ferum-dark rounded-xl border border-ferum-border text-center">
                    <i class="fa-solid fa-shield-halved text-emerald-400 text-lg mb-2"></i>
                    <p class="text-[11px] text-ferum-steel">Защита</p>
                    <p class="text-white font-bold text-sm">Активирована</p>
                </div>
            </div>
        </div>

        <button onclick="handleLogout()" class="w-full py-3 bg-ferum-border hover:bg-ferum-border/80 text-white font-medium rounded-xl text-sm transition-colors">
            Завершить сеанс
        </button>
    </div>

</div>


<script>
    // ==========================================
    // НАСТРОЙКИ
    // ==========================================

    // Адрес твоего Node.js backend
    const API_URL = 'http://localhost:3000';

    // ==========================================
    // ВАЖНО:
    // Здесь укажи название настоящего HTML-файла CRM
    // ==========================================

    const CRM_URL = '../CRM.html';


    // ==========================================
    // ПОКАЗ / СКРЫТИЕ ПАРОЛЯ
    // ==========================================

    function togglePassword() {

        const passwordInput =
            document.getElementById('password');

        const eyeIcon =
            document.getElementById('eye-icon');


        if (passwordInput.type === 'password') {

            passwordInput.type = 'text';

            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');

        } else {

            passwordInput.type = 'password';

            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }


    // ==========================================
    // АВТОРИЗАЦИЯ
    // ==========================================

    async function handleLogin(event) {

        event.preventDefault();


        // ------------------------------------------
        // Получаем элементы формы
        // ------------------------------------------

        const usernameInput =
            document.getElementById('username');

        const passwordInput =
            document.getElementById('password');

        const submitBtn =
            document.getElementById('submit-btn');

        const btnText =
            document.getElementById('btn-text');

        const btnSpinner =
            document.getElementById('btn-spinner');

        const alertBox =
            document.getElementById('auth-alert');


        // ------------------------------------------
        // Получаем значения
        // ------------------------------------------

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        // ------------------------------------------
        // Убираем старые ошибки
        // ------------------------------------------

        alertBox.classList.add('hidden');

        document
            .getElementById('username-error')
            .classList.add('hidden');

        document
            .getElementById('password-error')
            .classList.add('hidden');


        // ------------------------------------------
        // Проверяем логин
        // ------------------------------------------

        let isValid = true;


        if (!username) {

            document
                .getElementById('username-error')
                .classList.remove('hidden');

            isValid = false;
        }


        // ------------------------------------------
        // Проверяем пароль
        // ------------------------------------------

        if (!password || password.length < 3) {

            document
                .getElementById('password-error')
                .classList.remove('hidden');

            isValid = false;
        }


        // Если данные не прошли проверку
        if (!isValid) {
            return;
        }


        // ==========================================
        // НАЧАЛО АВТОРИЗАЦИИ
        // ==========================================

        submitBtn.disabled = true;

        btnText.textContent = 'Авторизация...';

        btnSpinner.classList.remove('hidden');


        try {

            // --------------------------------------
            // Отправляем логин и пароль на backend
            // --------------------------------------

            const response = await fetch(
                `${API_URL}/api/login`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            // --------------------------------------
            // Получаем ответ от сервера
            // --------------------------------------

            const data = await response.json();


            console.log(
                'Ответ сервера:',
                data
            );


            // ======================================
            // УСПЕШНАЯ АВТОРИЗАЦИЯ
            // ======================================

            if (response.ok && data.success) {


                // ----------------------------------
                // Сохраняем пользователя
                // ----------------------------------

                localStorage.setItem(
                    'user',
                    JSON.stringify(data.user)
                );


                // ----------------------------------
                // Сохраняем факт авторизации
                // ----------------------------------

                localStorage.setItem(
                    'isAuthenticated',
                    'true'
                );


                // ----------------------------------
                // Сообщаем в консоль
                // ----------------------------------

                console.log(
                    'Авторизация успешна:',
                    data.user
                );


                // ----------------------------------
                // Переходим в НАСТОЯЩУЮ CRM
                // ----------------------------------

                window.location.href = CRM_URL;


                return;
            }


            // ======================================
            // НЕПРАВИЛЬНЫЙ ЛОГИН ИЛИ ПАРОЛЬ
            // ======================================

            alertBox.className =
                'p-3 rounded-xl ' +
                'bg-red-500/10 ' +
                'border border-red-500/30 ' +
                'text-red-400 ' +
                'text-xs text-center mb-4';


            alertBox.textContent =
                data.message ||
                'Неверный логин или пароль.';


            alertBox.classList.remove('hidden');


        } catch (error) {


            // ======================================
            // ОШИБКА ПОДКЛЮЧЕНИЯ
            // ======================================

            console.error(
                'Ошибка подключения к backend:',
                error
            );


            alertBox.className =
                'p-3 rounded-xl ' +
                'bg-red-500/10 ' +
                'border border-red-500/30 ' +
                'text-red-400 ' +
                'text-xs text-center mb-4';


            alertBox.textContent =
                'Не удалось подключиться к серверу. ' +
                'Убедитесь, что backend запущен.';


            alertBox.classList.remove('hidden');


        } finally {


            // ======================================
            // Возвращаем кнопку
            // ======================================

            submitBtn.disabled = false;

            btnText.textContent =
                'Войти в систему';

            btnSpinner.classList.add('hidden');
        }
    }


    // ==========================================
    // ВЫХОД ИЗ АККАУНТА
    // ==========================================

    function handleLogout() {

        // Удаляем сохраненного пользователя
        localStorage.removeItem('user');

        // Удаляем авторизацию
        localStorage.removeItem('isAuthenticated');


        // Возвращаемся на страницу входа
        window.location.href = 'index.html';
    }


    // ==========================================
    // УВЕДОМЛЕНИЕ О РЕГИСТРАЦИИ
    // ==========================================

    function showRegisterNotice(e) {

        e.preventDefault();


        const alertBox =
            document.getElementById('auth-alert');


        alertBox.className =
            'p-3 rounded-xl ' +
            'bg-blue-500/10 ' +
            'border border-blue-500/30 ' +
            'text-blue-400 ' +
            'text-xs text-center mb-4';


        alertBox.textContent =
            'Регистрация новых учетных записей временно ' +
            'доступна по приглашениям администратора.';


        alertBox.classList.remove('hidden');
    }


    // ==========================================
    // ВОССТАНОВЛЕНИЕ ПАРОЛЯ
    // ==========================================

    function showRecoveryModal(e) {

        e.preventDefault();


        const alertBox =
            document.getElementById('auth-alert');


        alertBox.className =
            'p-3 rounded-xl ' +
            'bg-amber-500/10 ' +
            'border border-amber-500/30 ' +
            'text-amber-400 ' +
            'text-xs text-center mb-4';


        alertBox.textContent =
            'Инструкции по восстановлению отправлены ' +
            'на ваш привязанный email (демо).';


        alertBox.classList.remove('hidden');
    }


    // ==========================================
    // ПРОВЕРКА АВТОРИЗАЦИИ
    // ==========================================

    document.addEventListener(
        'DOMContentLoaded',
        () => {

            const isAuthenticated =
                localStorage.getItem(
                    'isAuthenticated'
                );


            const savedUser =
                localStorage.getItem('user');


            // --------------------------------------
            // Если пользователь уже вошел
            // --------------------------------------

            if (
                isAuthenticated === 'true' &&
                savedUser
            ) {

                try {

                    const user =
                        JSON.parse(savedUser);


                    if (
                        user &&
                        user.username
                    ) {

                        console.log(
                            'Пользователь уже авторизован:',
                            user.username
                        );


                        // Если это страница авторизации,
                        // сразу открываем CRM

                        if (
                            window.location.pathname.endsWith(
                                'index.html'
                            )
                            ||
                            window.location.pathname === '/'
                        ) {

                            window.location.href =
                                CRM_URL;
                        }
                    }

                } catch (error) {

                    console.error(
                        'Ошибка чтения пользователя:',
                        error
                    );


                    localStorage.removeItem('user');

                    localStorage.removeItem(
                        'isAuthenticated'
                    );
                }
            }
        }
    );
</script>


</body>
</html>
